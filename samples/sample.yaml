# Interlinked sample — YAML (a CI configuration)
name: ci
on:
  push:
    branches: [main]
defaults: &defaults
  runs-on: ubuntu-latest
  timeout-minutes: 10
jobs:
  test:
    <<: *defaults
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          npm ci
          npm test
        env:
          CI: true
          GREETING: "hello, world"
